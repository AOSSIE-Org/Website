version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # One PR for all minor/patch bumps instead of one per package
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Majors need a manual upgrade (e.g. Node types must match the CI Node version)
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci-cd"
